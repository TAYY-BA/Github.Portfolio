<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduBot – AI Study Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0d0f14;
      --surface:   #13161e;
      --card:      #1a1e2a;
      --border:    #252a38;
      --accent:    #5b8cff;
      --accent2:   #a78bfa;
      --green:     #34d399;
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --user-bg:   #1e2a4a;
      --bot-bg:    #1a1e2a;
      --radius:    16px;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .logo-mark {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head);
      font-weight: 800; font-size: 18px;
      color: #fff;
      box-shadow: 0 0 20px rgba(91,140,255,.35);
      flex-shrink: 0;
    }

    .header-text h1 {
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    .header-text p {
      font-size: 12px;
      color: var(--muted);
      font-weight: 300;
    }

    .status-dot {
      margin-left: auto;
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--green);
      font-weight: 500;
    }
    .status-dot::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; }
      50%      { opacity:.4; }
    }

    /* ── SUGGESTIONS BAR ── */
    .suggestions {
      display: flex;
      gap: 8px;
      padding: 14px 28px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .suggestions::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 12.5px;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all .2s;
      flex-shrink: 0;
    }
    .chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(91,140,255,.08);
    }

    /* ── MESSAGES AREA ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 28px 8px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── WELCOME STATE ── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      gap: 12px;
      padding: 40px 20px;
      animation: fadeUp .5s ease both;
    }
    .welcome-icon {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      box-shadow: 0 0 40px rgba(91,140,255,.25);
      margin-bottom: 8px;
    }
    .welcome h2 {
      font-family: var(--font-head);
      font-size: 26px;
      font-weight: 700;
    }
    .welcome p {
      color: var(--muted);
      font-size: 14px;
      max-width: 380px;
      line-height: 1.6;
    }

    /* ── BUBBLES ── */
    .msg {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: fadeUp .3s ease both;
      max-width: 820px;
      width: 100%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .msg.bot  .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .msg.user .avatar { background: var(--user-bg); border: 1px solid var(--border); }

    .bubble {
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.7;
      max-width: 680px;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border: 1px solid rgba(91,140,255,.25);
      border-top-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    /* markdown-ish formatting inside bot bubbles */
    .bubble strong { color: var(--accent); font-weight: 600; }
    .bubble em     { color: var(--accent2); }
    .bubble code {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 5px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }
    .bubble pre {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .bubble pre code { background: none; border: none; padding: 0; font-size: 13px; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 8px 0; }
    .bubble li { margin: 4px 0; }
    .bubble h1,.bubble h2,.bubble h3 {
      font-family: var(--font-head);
      color: var(--text);
      margin: 12px 0 6px;
    }
    .bubble h3 { font-size: 15px; }
    .bubble p  { margin: 6px 0; }

    /* ── TYPING INDICATOR ── */
    .typing .bubble {
      padding: 16px 18px;
    }
    .dots { display: flex; gap: 5px; }
    .dots span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0);   opacity:.4; }
      40%          { transform: translateY(-6px); opacity:1;  }
    }

    /* ── INPUT AREA ── */
    .input-wrap {
      padding: 16px 28px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px 10px 18px;
      transition: border-color .2s;
    }
    .input-row:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14.5px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
      flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 0 14px rgba(91,140,255,.45); }
    #send-btn:disabled { opacity: .4; cursor: default; transform: none; }
    #send-btn svg { width: 18px; height: 18px; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header, .suggestions, #messages, .input-wrap { padding-left: 16px; padding-right: 16px; }
      .bubble { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo-mark">E</div>
    <div class="header-text">
      <h1>EduBot</h1>
      <p>AI-Powered Study Assistant · Powered by Groq + Llama 3</p>
    </div>
    <div class="status-dot">Online</div>
  </header>

  <!-- QUICK SUGGESTION CHIPS -->
  <div class="suggestions">
    <button class="chip" onclick="sendChip(this)">📐 Explain linear regression</button>
    <button class="chip" onclick="sendChip(this)">🧬 What is DNA replication?</button>
    <button class="chip" onclick="sendChip(this)">⚡ Explain Newton's 2nd law</button>
    <button class="chip" onclick="sendChip(this)">🖥️ What is Big-O notation?</button>
    <button class="chip" onclick="sendChip(this)">📚 Give me a quiz on photosynthesis</button>
    <button class="chip" onclick="sendChip(this)">🧮 Help me understand recursion</button>
    <button class="chip" onclick="sendChip(this)">🗺️ Summarize World War II causes</button>
  </div>

  <!-- MESSAGES -->
  <div id="messages">
    <div class="welcome" id="welcome-screen">
      <div class="welcome-icon">🎓</div>
      <h2>Hello, I'm EduBot!</h2>
      <p>Ask me anything — from calculus to chemistry, algorithms to history. I'll explain it clearly, step by step.</p>
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-wrap">
    <div class="input-row">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Ask any study question…"
        oninput="autoResize(this)"
        onkeydown="handleKey(event)"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <p class="input-hint">Press Enter to send · Shift+Enter for new line</p>
  </div>

<script>
  // ── State ──
  let history = [];
  let isLoading = false;

  // ── Auto-resize textarea ──
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  // ── Handle Enter key ──
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── Chip click ──
  function sendChip(btn) {
    const text = btn.textContent.replace(/^[\p{Emoji}\s]+/u, '').trim();
    document.getElementById('user-input').value = text;
    sendMessage();
  }

  // ── Render simple markdown ──
  function renderMarkdown(text) {
    return text
      .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      .replace(/^[\-\*] (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/^(?!<[huplb])(.+)$/gm, (m) => m.startsWith('<') ? m : `<p>${m}</p>`);
  }

  // ── Append message bubble ──
  function appendMessage(role, content) {
    const welcome = document.getElementById('welcome-screen');
    if (welcome) welcome.remove();

    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🧑' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'bot') {
      bubble.innerHTML = renderMarkdown(content);
    } else {
      bubble.textContent = content;
    }

    div.appendChild(avatar);
    div.appendChild(bubble);
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  // ── Typing indicator ──
  function showTyping() {
    const welcome = document.getElementById('welcome-screen');
    if (welcome) welcome.remove();

    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.id = 'typing-indicator';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';

    div.appendChild(avatar);
    div.appendChild(bubble);
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  // ── Send message ──
  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    isLoading = true;
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;

    appendMessage('user', text);
    history.push({ role: 'user', content: text });

    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history.slice(0, -1) })
      });

      const data = await res.json();
      hideTyping();

      if (data.error) {
        appendMessage('bot', `⚠️ Error: ${data.error}`);
      } else {
        appendMessage('bot', data.reply);
        history.push({ role: 'assistant', content: data.reply });
        // Keep history to last 20 messages to avoid token overflow
        if (history.length > 20) history = history.slice(-20);
      }
    } catch (err) {
      hideTyping();
      appendMessage('bot', '⚠️ Could not reach the server. Make sure Flask is running.');
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
</script>
</body>
</html>
